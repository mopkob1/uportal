<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UPORTAL links</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="header-row header-main">
      <div class="brand">
        <a id="popupLogoLink" class="logo-link" href="#" target="_blank" rel="noopener noreferrer" title="UPORTAL">
          <img class="brand-logo" src="../icons/uportal-logo.svg" alt="UPORTAL">
        </a>
        <span id="versionBadge" class="version-badge"></span>
      </div>
      <div class="enabled-switch" role="group" aria-label="UPORTAL state">
        <button id="switchOff" type="button" class="switch-segment">OFF</button>
        <button id="switchOn" type="button" class="switch-segment">ON</button>
      </div>
    </div>
    <div class="header-row utility-row">
      <button id="copyClientUid" class="uid-copy" type="button" title="Copy plugin UID">UID</button>
      <input id="tagFilter" type="search" placeholder="tags...">
      <button id="refresh" type="button" title="Refresh dictionary">↻</button>
    </div>
  </header>

  <main>
    <div id="content" class="list">
      <div class="muted">Loading dictionary...</div>
    </div>
  </main>

  <footer>
    <button id="insertSelected" type="button">Insert selected</button>
  </footer>

  <script src="../captions.js"></script>
  <script src="popup.js"></script>
</body>
</html>
